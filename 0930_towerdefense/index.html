<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a20">
<title>숲의 수호자 · 타워 디펜스</title>
<style>
  :root{color-scheme:dark;--bg:#101a20;--panel:#19272e;--line:#2b3d42;--cream:#f4eedb;--muted:#a0b0a8;--mint:#a8d4a0;--gold:#f2c86b}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#233a39 0,#101a20 65%);color:var(--cream);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:24px}
  .game{width:800px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 16px}.eyebrow{margin:0 0 3px;color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.18em}h1{margin:0;font-size:clamp(23px,4vw,34px);letter-spacing:-.04em}.intro{margin:4px 0 0;color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px}.stat{min-width:92px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#19272ed9}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em}.stat strong{font-size:19px}.gold strong{color:var(--gold)}.stat.danger strong{color:#ff6565}
  .board-wrap{position:relative;overflow:hidden;border:1px solid #466252;border-radius:18px;background:#718e59;box-shadow:0 24px 70px #0007}.board-wrap.shake{animation:shake .28s ease-out}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}canvas{display:block;width:800px;height:600px;cursor:crosshair;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101a20a6;backdrop-filter:blur(3px);text-align:center;padding:20px}.overlay.hidden{display:none}.modal{max-width:400px;padding:26px 30px;border:1px solid #607b66;border-radius:18px;background:#19272eef;box-shadow:0 15px 50px #0006}.modal h2{margin:0 0 7px;font-size:28px}.modal p{margin:0 0 19px;color:#c3d0c3}.primary{border:0;border-radius:11px;padding:12px 23px;background:var(--mint);color:#183025;font:800 14px inherit;cursor:pointer}.primary:hover{background:#c1e4b8}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#19272e}.help{color:#c1cdc3;font-size:13px}.help b{color:var(--gold)}.actions{display:flex;gap:8px}button.secondary{padding:9px 13px;border:1px solid #3b5054;border-radius:9px;background:#22343a;color:var(--cream);font-weight:700;cursor:pointer}button.secondary:hover{background:#2d4347}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.tip{text-align:center;color:#879993;font-size:11px;margin:10px 0 0}
  @media(max-width:850px){body{display:block;padding:12px;overflow-x:auto}.game{margin:0 auto}header{align-items:start;flex-direction:column;gap:13px}.stats{width:100%}.stat{flex:1;min-width:0;padding:7px 10px}.stat strong{font-size:17px}.board-wrap{border-radius:12px}.toolbar{align-items:stretch;flex-direction:column;gap:9px;padding:11px}.actions button{flex:1}.help{font-size:12px}.modal{padding:21px 18px}}
</style>
</head>
<body>
<main class="game">
  <header><div><p class="eyebrow">WOODLAND DEFENSE</p><h1>숲의 수호자</h1><p class="intro">숲길을 따라오는 몬스터를 막아 주세요.</p></div><div class="stats" aria-live="polite"><div class="stat gold"><span>골드</span><strong id="gold">150</strong></div><div class="stat"><span>숲의 체력</span><strong id="health">10</strong></div><div class="stat"><span>웨이브</span><strong id="wave">0 / 15</strong></div></div></header>
  <div class="board-wrap" id="boardWrap"><canvas id="board" width="800" height="600" aria-label="800 곱하기 600 타워 디펜스 게임판"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="messageTitle">숲의 마지막 관문을 지켜라</h2><p id="message">오래된 숲과 마을을 잇는 마지막 길. 15개의 웨이브를 막아 숲을 지켜 주세요.</p><button class="primary" id="start">게임 시작</button></div></div></div>
  <section class="toolbar"><div class="help">빈 칸 클릭: 타워 설치 <b>50 G</b> <span>·</span> 타워 클릭: 업그레이드 <b>75 G / 125 G</b> <span>·</span> 우클릭: 판매 <b>+25 G</b> <span>·</span> 처치 <b>+20 G</b><div id="notice" role="status" aria-live="polite" style="min-height:20px;color:#f2c86b"></div></div><div class="actions"><button class="secondary" id="pause">Ⅱ　일시 정지</button><button class="secondary" id="restart">↻　처음부터</button></div></section>
  <p class="tip">타워는 사거리 안의 적을 자동으로 공격합니다. 몬스터가 길 끝에 도착하면 숲의 체력이 줄어듭니다.</p>
</main>
<script>
(()=>{
  const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),goldEl=document.querySelector('#gold'),healthEl=document.querySelector('#health'),waveEl=document.querySelector('#wave'),overlay=document.querySelector('#overlay'),boardWrap=document.querySelector('#boardWrap');
  const W=800,H=600,C=50,cols=16,rows=12,cent=p=>[p[0]*C+C/2,p[1]*C+C/2];
  const openingPath=[[0,1],[1,1],[2,1],[3,1],[4,1],[4,2],[4,3],[4,4],[5,4],[6,4],[7,4],[7,3],[7,2],[7,1],[8,1],[9,1],[10,1],[10,2],[10,3],[10,4],[11,4],[12,4],[13,4],[13,5],[13,6],[14,6],[15,6]];
  const routeMaps=[
    [openingPath],
    [
      [[0,1],[1,1],[2,1],[3,1],[4,1],[4,2],[4,3],[4,4],[5,4],[6,4],[7,4],[7,3],[7,2],[7,1],[8,1],[9,1]],
      [[0,1],[1,1],[2,1],[3,1],[4,1],[4,0],[5,0],[6,0],[7,0],[8,0],[8,1],[9,1]],
    ].map(route=>route.concat([[10,1],[10,2],[10,3],[10,4],[11,4],[12,4],[13,4],[13,5],[13,6],[14,6],[15,6]])),
    [
      [[0,8],[1,8],[2,8],[3,8],[3,7],[3,6],[4,6],[5,6],[6,6],[6,5],[7,5],[8,5],[9,5]],
      [[0,8],[1,8],[2,8],[3,8],[3,9],[3,10],[4,10],[5,10],[6,10],[7,10],[7,9],[7,8],[8,8],[8,7],[8,6],[9,6],[9,5]],
    ].map(route=>route.concat([[10,5],[11,5],[12,5],[13,5],[14,5],[14,6],[14,7],[14,8],[15,8]])),
    [
      [[0,3],[1,3],[2,3],[3,3],[4,3],[4,2],[4,1],[5,1],[6,1],[7,1],[8,1],[8,2],[8,3],[8,4],[9,4],[9,5],[9,6]],
      [[0,3],[1,3],[2,3],[3,3],[4,3],[4,4],[4,5],[5,5],[6,5],[7,5],[7,6],[8,6],[9,6]],
    ].map(route=>route.concat([[10,6],[11,6],[12,6],[13,6],[13,7],[13,8],[14,8],[15,8]])),
    [
      [[0,5],[1,5],[2,5],[3,5],[3,4],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[11,4],[11,5]],
      [[0,5],[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5]],
      [[0,5],[1,5],[2,5],[3,5],[3,6],[3,7],[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[10,7],[11,7],[11,6],[11,5]],
    ].map(route=>route.concat([[12,5],[13,5],[14,5],[15,5]])),
  ];
  let activeRoutes=routeMaps[0],pathSet=new Set(activeRoutes.flatMap(routes=>routes.map(p=>p.join(','))));
  let towers=[],enemies=[],bullets=[],gold=150,health=10,wave=0,spawned=0,spawnClock=0,state='ready',last=0,decor=[],noticeTimer=0,floatingTexts=[],healthFlash=0,waveRewarded=false;
  let seed=92;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<90;i++)decor.push({x:rand()*W,y:rand()*H,r:2+rand()*5,a:.06+rand()*.1});
  function reset(){towers=[];enemies=[];bullets=[];floatingTexts=[];gold=150;health=10;wave=0;spawned=0;spawnClock=0;waveRewarded=false;activeRoutes=routeMaps[0];pathSet=new Set(activeRoutes.flatMap(route=>route.map(p=>p.join(','))));state='playing';healthFlash=0;document.querySelector('.stat:nth-child(2)').classList.remove('danger');document.querySelector('#pause').textContent='Ⅱ　일시 정지';overlay.classList.add('hidden');sync()}
  function beginWave(){wave++;spawned=0;spawnClock=.45;waveRewarded=false;const mapIndex=wave<=3?0:wave<=6?1:wave<=9?2:wave===10?3:4;activeRoutes=routeMaps[mapIndex];pathSet=new Set(activeRoutes.flatMap(route=>route.map(p=>p.join(','))));const roads=new Set(pathSet),trapped=towers.filter(t=>roads.has(`${(t.x-C/2)/C},${(t.y-C/2)/C}`));if(trapped.length){towers=towers.filter(t=>!trapped.includes(t));const refund=trapped.reduce((sum,t)=>sum+(t.invested||50),0);gold+=refund;showNotice(`길이 바뀌어 타워 ${trapped.length}개를 철거하고 ${refund}골드를 환불했습니다`)}if(mapIndex!==0)showNotice(mapIndex===4?'세 갈래 길이 열렸습니다!':`새로운 길과 갈림길이 열렸습니다 · 맵 ${mapIndex}`)}
  function spawn(){const route=activeRoutes[spawned%activeRoutes.length],[x,y]=cent(route[0]),boss=(wave===5||wave===10||wave===15)&&spawned===0,armored=wave>=8&&!boss&&spawned%3===2,normalHp=2+Math.floor(wave/2),hp=boss?(wave===5?35:wave===10?65:105):armored?6+Math.floor(wave*1.15):normalHp;enemies.push({x,y,path:route,index:1,hp,max:hp,speed:boss?30:armored?Math.max(28,38+wave):43+wave*2,r:boss?21:armored?16:13,boss,armored,armor:boss&&wave>=10?2:armored?1:0})}
  function update(dt){if(state!=='playing')return;if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)document.querySelector('#notice').textContent=''}if(healthFlash>0){healthFlash-=dt;if(healthFlash<=0)document.querySelector('.stat:nth-child(2)').classList.remove('danger')}if(wave===0)beginWave();spawnClock-=dt;if(spawned<5+wave&&spawnClock<=0){spawn();spawned++;spawnClock=1.18}
    for(const e of enemies){const [tx,ty]=cent(e.path[e.index]),dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy),step=e.speed*dt;if(d<=step){e.x=tx;e.y=ty;e.index++;if(e.index>=e.path.length){e.escaped=true;health--;healthFlash=.8;document.querySelector('.stat:nth-child(2)').classList.add('danger');setTimeout(()=>document.querySelector('.stat:nth-child(2)').classList.remove('danger'),800);boardWrap.classList.remove('shake');void boardWrap.offsetWidth;boardWrap.classList.add('shake');setTimeout(()=>boardWrap.classList.remove('shake'),300);sync();if(health<=0)finish(false)}}else{e.x+=dx/d*step;e.y+=dy/d*step}}
    enemies=enemies.filter(e=>!e.escaped&&e.hp>0);
    for(const t of towers){t.cooldown-=dt;if(t.cooldown<=0){const target=enemies.find(e=>Math.hypot(e.x-t.x,e.y-t.y)<142);if(target){bullets.push({x:t.x,y:t.y,target,damage:t.level});t.cooldown=.62}}}
    for(const b of bullets){const e=b.target;if(!enemies.includes(e)||e.hp<=0){b.done=true;continue}const dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy),step=350*dt;if(d<step+e.r){e.hp-=Math.max(1,b.damage-e.armor);b.done=true;if(e.hp<=0){gold+=20;floatingTexts.push({x:e.x,y:e.y-20,text:'+20',life:1,max:1})}}else{b.x+=dx/d*step;b.y+=dy/d*step}}
    for(const f of floatingTexts){f.life-=dt;f.y-=24*dt}floatingTexts=floatingTexts.filter(f=>f.life>0);
    bullets=bullets.filter(b=>!b.done);enemies=enemies.filter(e=>e.hp>0);if(state!=='playing')return;
    if(spawned===5+wave&&!enemies.length){if(!waveRewarded){gold+=25;floatingTexts.push({x:W/2,y:48,text:'+25 웨이브 보너스',life:1.5,max:1.5});waveRewarded=true;sync()}if(wave>=15)finish(true);else if(spawnClock<=0){beginWave()}else{spawnClock=Math.min(spawnClock,.7)}}sync()
  }
  function sync(){goldEl.textContent=gold;healthEl.textContent=health;waveEl.textContent=`${wave} / 15`}
  function finish(won){state=won?'won':'lost';const stars=health>=8?3:health>=4?2:1;document.querySelector('#messageTitle').textContent=won?'숲에 평화가 돌아왔어요':'마지막 관문이 무너졌어요';document.querySelector('#message').textContent=won?`숲과 마을을 지켜 냈습니다! 남은 체력 ${health} · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}`:`숲길을 끝까지 지키지 못했습니다. 남은 체력 ${health} · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}`;document.querySelector('#start').textContent='다시 도전';overlay.classList.remove('hidden')}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#78945b';ctx.fillRect(0,0,W,H);for(const d of decor){ctx.fillStyle=`rgba(34,65,42,${d.a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}
    for(const key of pathSet){const [x,y]=key.split(',').map(Number);ctx.fillStyle='#c5ad72';ctx.fillRect(x*C,y*C,C,C);ctx.fillStyle='#d7c58f';ctx.fillRect(x*C+5,y*C+5,C-10,C-10)}
    ctx.strokeStyle='#223d3440';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*C,0);ctx.lineTo(x*C,H);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*C);ctx.lineTo(W,y*C);ctx.stroke()}
    for(const t of towers){ctx.fillStyle='#274e43';ctx.beginPath();ctx.arc(t.x,t.y,21,0,7);ctx.fill();ctx.fillStyle='#e4c875';ctx.beginPath();ctx.arc(t.x,t.y,15,0,7);ctx.fill();ctx.fillStyle='#4f83ae';ctx.beginPath();ctx.arc(t.x,t.y,10,0,7);ctx.fill();ctx.fillStyle='#c3e3d3';ctx.beginPath();ctx.arc(t.x,t.y,4,0,7);ctx.fill();ctx.fillStyle='#f6e7aa';ctx.font='bold 10px system-ui';ctx.fillText('★'.repeat(t.level),t.x-8,t.y+31)}
    for(const e of enemies){ctx.fillStyle=e.boss?'#523765':e.armored?'#324f59':'#793e36';ctx.beginPath();ctx.arc(e.x,e.y+2,e.r+2,0,7);ctx.fill();ctx.fillStyle=e.boss?'#aa70c9':e.armored?'#78a9ad':'#d66b51';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#ffe4ad';ctx.beginPath();ctx.arc(e.x-4,e.y-2,2,0,7);ctx.arc(e.x+4,e.y-2,2,0,7);ctx.fill();if(e.armored){ctx.fillStyle='#d0e2d7';ctx.fillRect(e.x-8,e.y-e.r-1,16,4)}const barW=e.boss?44:e.armored?36:30,barY=e.y-e.r-10;ctx.fillStyle='#392b2a';ctx.fillRect(e.x-barW/2,barY,barW,5);ctx.fillStyle=e.boss?'#df9ef5':e.armored?'#a9d9dc':'#f3cf6e';ctx.fillRect(e.x-barW/2,barY,barW*Math.max(0,e.hp/e.max),5)}
    ctx.fillStyle='#fff1a9';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}
    for(const f of floatingTexts){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle='#fff0a0';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1}ctx.textAlign='left'
  }
  function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();requestAnimationFrame(loop)}
  function cellAt(e){const r=canvas.getBoundingClientRect();return [Math.floor((e.clientX-r.left)*W/r.width/C),Math.floor((e.clientY-r.top)*H/r.height/C)]}
  canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('mousedown',e=>{if(state!=='playing'||e.button!==2)return;const [x,y]=cellAt(e),i=towers.findIndex(t=>t.x===x*C+C/2&&t.y===y*C+C/2);if(i>=0){towers.splice(i,1);gold+=25;sync()}});
  function showNotice(message){const n=document.querySelector('#notice');n.textContent=message;noticeTimer=2}
  canvas.addEventListener('click',e=>{if(state!=='playing')return;const [x,y]=cellAt(e),key=`${x},${y}`;if(x<0||x>=cols||y<0||y>=rows||pathSet.has(key))return;const towerIndex=towers.findIndex(t=>t.x===x*C+C/2&&t.y===y*C+C/2);if(towerIndex>=0){const t=towers[towerIndex],cost=t.level===1?75:125;if(t.level>=3){showNotice('타워가 최대 단계입니다');return}if(gold<cost){showNotice('골드가 부족합니다');return}gold-=cost;t.level++;t.invested=(t.invested||50)+cost;sync();showNotice(`타워 레벨 ${t.level} 업그레이드`);return}if(gold<50){showNotice('골드가 부족합니다');return}gold-=50;towers.push({x:x*C+C/2,y:y*C+C/2,cooldown:.15,level:1,invested:50});sync()});
  document.querySelector('#start').onclick=()=>{if(state==='paused'){state='playing';overlay.classList.add('hidden');document.querySelector('#pause').textContent='Ⅱ　일시 정지'}else reset()};document.querySelector('#restart').onclick=()=>reset();document.querySelector('#pause').onclick=e=>{if(state==='playing'){state='paused';e.currentTarget.textContent='▶　계속하기';document.querySelector('#messageTitle').textContent='잠시 쉬어 가요';document.querySelector('#message').textContent='준비되면 계속하기를 눌러 주세요.';document.querySelector('#start').textContent='계속하기';overlay.classList.remove('hidden')}else if(state==='paused'){state='playing';overlay.classList.add('hidden');e.currentTarget.textContent='Ⅱ　일시 정지'}};
  requestAnimationFrame(loop)
})();
</script>
</body>
</html>
