<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숲길 수호대 — 타워 디펜스</title>
  <style>
    :root { color-scheme: dark; --ink:#eaf3eb; --muted:#9db0a0; --panel:#17251f; --line:#2c4035; --lime:#b8ed83; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -10%,#263d30 0,#121c18 58%); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif; }
    .shell { width:min(1080px,100%); margin:auto; padding:28px 22px 36px }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 0 20px }
    .eyebrow { color:var(--lime); font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase }
    h1 { margin:4px 0 0; font-size:clamp(25px,4vw,36px); letter-spacing:-.04em }
    .best { color:var(--muted); font-size:13px }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px }
    .stat,.board-wrap,.controls { border:1px solid var(--line); background:rgba(23,37,31,.9); border-radius:14px }
    .stat { padding:12px 16px }
    .label { color:var(--muted); font-size:11px; letter-spacing:.08em; font-weight:700 }
    .value { margin-top:3px; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums }
    .value small { font-size:13px; color:var(--muted); font-weight:600 }
    .board-wrap { padding:12px; position:relative; overflow:hidden }
    canvas { display:block; width:100%; height:auto; border-radius:9px; touch-action:manipulation; cursor:crosshair }
    .overlay { display:none; position:absolute; inset:12px; border-radius:9px; background:rgba(8,15,12,.76); align-items:center; justify-content:center; text-align:center; padding:20px; }
    .overlay.show { display:flex }
    .modal { max-width:390px }
    .modal h2 { font-size:32px; margin:0 0 7px }
    .modal p { color:#bfd0c2; margin:0 0 18px; line-height:1.6 }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; margin-top:12px }
    .hint { color:var(--muted); font-size:13px; line-height:1.55 }
    button { border:0; border-radius:10px; background:var(--lime); color:#142016; padding:12px 18px; font:inherit; font-weight:850; cursor:pointer; transition:transform .15s,filter .15s; white-space:nowrap }
    button:hover { transform:translateY(-1px); filter:brightness(1.06) }
    button:disabled { background:#3a4a3f; color:#829185; cursor:not-allowed; transform:none; filter:none }
    .toast { height:22px; padding:5px 3px 0; color:#f2c987; font-size:12px; opacity:0; transition:opacity .2s }
    .toast.visible { opacity:1 }
    @media(max-width:600px) { .shell{padding:20px 12px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:10px 12px}.value{font-size:20px}.controls{align-items:flex-start}.hint{font-size:12px}.board-wrap{padding:7px}header{align-items:flex-start}.best{text-align:right;font-size:11px} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">WOODLAND DEFENSE · 01</div><h1>숲길 수호대</h1></div>
      <div class="best">마을을 지키고<br>끝없이 밀려오는 적을 막으세요</div>
    </header>
    <section class="stats" aria-label="게임 상태">
      <div class="stat"><div class="label">마을 체력</div><div class="value" id="health">♥ 20</div></div>
      <div class="stat"><div class="label">보유 골드</div><div class="value" id="gold">● 100</div></div>
      <div class="stat"><div class="label">현재 웨이브</div><div class="value" id="wave">1 <small>/ 준비</small></div></div>
      <div class="stat"><div class="label">처치한 적</div><div class="value" id="kills">0</div></div>
    </section>
    <div class="board-wrap">
      <canvas id="game" width="900" height="600" aria-label="타워를 설치하는 게임 보드"></canvas>
      <div class="overlay" id="overlay"><div class="modal"><h2>숲길이 무너졌어요</h2><p id="endcopy">마을을 더 오래 지켜내 볼까요?</p><button id="restart">다시 시작</button></div></div>
    </div>
    <div class="controls"><div class="hint">빈 풀밭을 클릭해 화살 타워를 설치하세요.<br>타워는 사거리 안의 적을 자동으로 공격합니다. (설치 비용 50골드)</div><button id="waveBtn">웨이브 시작&nbsp; →</button></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
<script>
(() => {
  const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
  const cols = 15, rows = 10, cell = 60, W = cols*cell, H = rows*cell;
  const route = [[0,4],[1,4],[2,4],[3,4],[3,3],[3,2],[4,2],[5,2],[6,2],[6,3],[6,4],[6,5],[7,5],[8,5],[9,5],[9,4],[9,3],[9,2],[10,2],[11,2],[12,2],[12,3],[12,4],[12,5],[12,6],[13,6],[14,6]];
  const routeSet = new Set(route.map(([x,y])=>`${x},${y}`));
  let towers=[], enemies=[], arrows=[], particles=[], health=20, gold=100, kills=0, wave=0, spawning=0, spawnClock=0, active=false, ended=false, last=0, toastTimer;
  const waveBtn=document.querySelector('#waveBtn'), overlay=document.querySelector('#overlay');
  const colors={ grass:'#23382c', grass2:'#263d2f', path:'#8d7956', pathEdge:'#6c5c43' };
  function hud(){ document.querySelector('#health').textContent=`♥ ${health}`; document.querySelector('#gold').textContent=`● ${gold}`; document.querySelector('#wave').innerHTML=`${wave||1} <small>${active?' / 진행 중':' / 준비'}</small>`; document.querySelector('#kills').textContent=kills; waveBtn.disabled=active||ended; waveBtn.textContent=active?'웨이브 진행 중…':'웨이브 시작  →'; }
  function say(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),1800)}
  function center([x,y]){return [x*cell+cell/2,y*cell+cell/2]}
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ctx.fillStyle=(x+y)%2?colors.grass:colors.grass2;ctx.fillRect(x*cell,y*cell,cell,cell);ctx.strokeStyle='rgba(177,207,174,.055)';ctx.strokeRect(x*cell,y*cell,cell,cell)}
    // Winding stone path
    ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();route.forEach(([x,y],i)=>{const [px,py]=center([x,y]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.strokeStyle=colors.pathEdge;ctx.lineWidth=cell*.78;ctx.stroke();ctx.strokeStyle=colors.path;ctx.lineWidth=cell*.68;ctx.stroke();
    route.forEach(([x,y],i)=>{if(i%2===0){const [px,py]=center([x,y]);ctx.fillStyle='rgba(255,235,187,.11)';ctx.beginPath();ctx.ellipse(px-7,py+6,9,4,-.4,0,Math.PI*2);ctx.fill()}});
    // Entrance and village
    const [sx,sy]=center(route[0]),[ex,ey]=center(route[route.length-1]);
    ctx.font='25px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🌲',sx,sy);ctx.fillText('🏡',ex,ey);
    for(const t of towers){const [x,y]=center([t.x,t.y]);ctx.fillStyle='rgba(10,15,11,.22)';ctx.beginPath();ctx.ellipse(x,y+12,20,8,0,0,7);ctx.fill();ctx.fillStyle='#b7df87';ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();ctx.fillStyle='#536f48';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.strokeStyle='#ead49c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+17,y-18);ctx.stroke();ctx.fillStyle='#f2d493';ctx.beginPath();ctx.arc(x+18,y-19,4,0,7);ctx.fill()}
    for(const a of arrows){ctx.strokeStyle='#ffe4a1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx*.025,a.y-a.vy*.025);ctx.stroke()}
    for(const e of enemies){if(e.dead)continue;const [x,y]=enemyPos(e);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+11,e.r*1.1,5,0,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(x,y,e.r,0,7);ctx.fill();ctx.fillStyle='#fff1dd';ctx.beginPath();ctx.arc(x+4,y-3,2.3,0,7);ctx.fill();ctx.fillStyle='#372d27';ctx.beginPath();ctx.arc(x+5,y-3,1,0,7);ctx.fill();ctx.fillStyle='#452c28';ctx.fillRect(x-e.r,y-e.r-8,e.r*2,4);ctx.fillStyle='#e87561';ctx.fillRect(x-e.r,y-e.r-8,e.r*2*Math.max(0,e.hp/e.maxHp),4)}
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
  }
  function enemyPos(e){const i=Math.min(Math.floor(e.progress),route.length-2), f=e.progress-i;const [a,b]=[center(route[i]),center(route[i+1])];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
  function spawn(){const hp=40+wave*12;enemies.push({progress:0,hp,maxHp:hp,speed:.72+Math.min(wave*.025,.32),r:13+Math.min(wave,5),reward:10+Math.floor(wave/3),color:['#e88967','#d9aa62','#c57a68'][Math.min(2,Math.floor((wave-1)/4))]})}
  function startWave(){if(active||ended)return;wave++;active=true;spawning=7+wave*2;spawnClock=0;hud();say(`웨이브 ${wave} — 적 ${spawning}마리가 다가옵니다!`)}
  function burst(x,y,color){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*95,vy:(Math.random()-.5)*95,life:.45,max:.45,r:2+Math.random()*2,color})}
  function finish(){ended=true;active=false;document.querySelector('#endcopy').textContent=`${wave} 웨이브까지 버텼고 ${kills}마리를 처치했어요. 다시 도전해 볼까요?`;overlay.classList.add('show');hud()}
  function update(dt){
    if(active){spawnClock-=dt;if(spawning>0&&spawnClock<=0){spawn();spawning--;spawnClock=.72} if(spawning===0&&enemies.length===0){active=false;say('웨이브를 막아냈습니다! 다음 준비를 하세요.');hud()}}
    for(const e of enemies){if(e.dead)continue;e.progress+=e.speed*dt;if(e.progress>=route.length-1){e.dead=true;health-=1;burst(...center(route.at(-1)),'#e87561');if(health<=0){health=0;finish()}hud()}}
    for(const t of towers){t.cooldown-=dt;if(t.cooldown<=0){const [tx,ty]=center([t.x,t.y]);let target=null,dist=135;for(const e of enemies){if(e.dead)continue;const [x,y]=enemyPos(e),d=Math.hypot(x-tx,y-ty);if(d<dist){target=e;dist=d}}if(target){const [x,y]=enemyPos(target),d=Math.hypot(x-tx,y-ty);arrows.push({x:tx,y:ty,target,vx:(x-tx)/d*390,vy:(y-ty)/d*390,life:1.1});t.cooldown=.55}}}
    for(const a of arrows){a.life-=dt;if(a.target.dead){a.life=0;continue}const [x,y]=enemyPos(a.target),dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy),step=390*dt;if(d<step+7){a.target.hp-=25;a.life=0;burst(x,y,'#f1d394');if(a.target.hp<=0){a.target.dead=true;gold+=a.target.reward;kills++;burst(x,y,'#c6e89b');hud()}}else{a.x+=dx/d*step;a.y+=dy/d*step}}
    arrows=arrows.filter(a=>a.life>0);enemies=enemies.filter(e=>!e.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
  }
  function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(!ended)update(dt);draw();requestAnimationFrame(frame)}
  function pointer(ev){const r=canvas.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*cols),y=Math.floor((ev.clientY-r.top)/r.height*rows);if(x<0||x>=cols||y<0||y>=rows||ended)return;if(routeSet.has(`${x},${y}`)){say('적의 길 위에는 타워를 놓을 수 없어요.');return}if(towers.some(t=>t.x===x&&t.y===y)){say('이미 타워가 있는 자리예요.');return}if(gold<50){say('골드가 부족해요. 적을 처치해 골드를 모으세요.');return}towers.push({x,y,cooldown:.2});gold-=50;hud();burst(x*cell+cell/2,y*cell+cell/2,'#c6e89b')}
  canvas.addEventListener('pointerdown',pointer);waveBtn.addEventListener('click',startWave);
  document.querySelector('#restart').addEventListener('click',()=>{towers=[];enemies=[];arrows=[];particles=[];health=20;gold=100;kills=0;wave=0;spawning=0;active=false;ended=false;overlay.classList.remove('show');hud()});
  hud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
